name: CI
on:
  push:
  pull_request:
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run readiness
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
